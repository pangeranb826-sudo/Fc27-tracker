<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FC27 Career Hub</title>
<style>
:root{--bg:#0a0e17;--p:rgba(255,255,255,.06);--b:rgba(255,255,255,.1);--t:#eef2ff;--m:#8b95b0;--a:#2dd4bf;--g:#fbbf24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#16314a55,transparent),var(--bg);color:var(--t);font:14px system-ui,sans-serif}
#app{display:flex;min-height:100vh}nav{width:200px;padding:14px 10px;border-right:1px solid var(--b);position:sticky;top:0;height:100vh;overflow:auto;flex:none}
.logo{font-weight:800;letter-spacing:1px;color:var(--a);margin:4px 8px 12px}nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--m);padding:9px 10px;border-radius:10px;cursor:pointer;font-size:13px;transition:.2s}
nav button:hover,nav button.on{background:var(--p);color:var(--t)}main{flex:1;padding:18px;min-width:0;max-width:1100px;animation:in .3s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.card{background:var(--p);border:1px solid var(--b);border-radius:16px;padding:14px;backdrop-filter:blur(12px);margin-bottom:12px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.stat{text-align:center}.stat b{display:block;font-size:22px;color:var(--a)}.stat span{color:var(--m);font-size:11px}
h2{margin:0 0 12px}h3{margin:0 0 8px;font-size:15px}.btn{background:linear-gradient(135deg,#14b8a6,#2563eb);border:0;color:#fff;padding:8px 13px;border-radius:10px;cursor:pointer;font-weight:600;margin:2px;font-size:13px}.btn.g{background:var(--p);border:1px solid var(--b)}.btn.r{background:#b91c1c}
input,select,textarea{width:100%;background:#0006;border:1px solid var(--b);color:var(--t);padding:8px;border-radius:8px;margin:3px 0 8px;font:inherit}label{font-size:11px;color:var(--m)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.tag{display:inline-block;background:#2dd4bf22;color:var(--a);padding:2px 8px;border-radius:99px;font-size:11px}
.cab{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;background:linear-gradient(#ffffff0d,#0000),#0003;border:2px solid #fbbf2455;border-radius:14px;padding:12px}
.cabinet{position:relative;overflow:hidden;background:radial-gradient(400px 200px at 50% 0,#fbbf2430,transparent),linear-gradient(#1c1409,#0d0a05);border:7px solid #6b4423;border-radius:14px;box-shadow:inset 0 0 50px #000c,0 0 30px #fbbf2422}.cabinet::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffff12 45%,transparent 55%);pointer-events:none}.shelf{padding:8px 10px 0}.shelf h4{margin:4px 0;font-size:11px;letter-spacing:2px;color:#fbbf24aa;text-transform:uppercase}.shelf .items{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;min-height:104px;padding-bottom:6px;border-bottom:9px solid #7a4e22;box-shadow:0 7px 10px #000a}.shelf .tro{width:96px;background:none;border-bottom:0;cursor:pointer;transition:.2s}.shelf .tro:hover{transform:translateY(-4px) scale(1.06)}.shelf .empty{color:#fff4;font-size:11px;align-self:center}.tro{text-align:center;padding:10px 4px;border-radius:10px;background:linear-gradient(#fbbf2418,transparent);border-bottom:3px solid #fbbf2466;font-size:11px}.tro i{font-style:normal;font-size:34px;display:block;filter:drop-shadow(0 0 8px #fbbf24)}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;padding:14px}#modal>div{background:#111827;border:1px solid var(--b);border-radius:16px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1);text-align:center}.pop i{font-size:80px;display:block;font-style:normal}@keyframes pop{from{transform:scale(.2);opacity:0}}
.bub{max-width:80%;padding:8px 12px;border-radius:14px;margin:4px 0;background:var(--p)}.bub.me{margin-left:auto;background:#2563eb88}
.bar{height:8px;background:#fff1;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--g))}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:6px;border-bottom:1px solid var(--b);text-align:left}.toast{position:fixed;bottom:80px;right:14px;background:#111827;border:1px solid var(--a);padding:10px 14px;border-radius:12px;z-index:60;animation:in .3s}
html,body{background:radial-gradient(900px 500px at 85% -10%,#2dd4bf30,transparent),radial-gradient(800px 500px at -10% 110%,#6366f130,transparent),#070a12}nav{background:#0b1020cc;backdrop-filter:blur(16px)}.logo{font-size:16px;background:linear-gradient(90deg,var(--a),var(--g));-webkit-background-clip:text;background-clip:text;color:transparent}nav button{border-radius:12px;padding:11px 12px;margin-bottom:2px}nav button.on{background:linear-gradient(90deg,#2dd4bf33,#6366f122);color:#fff;box-shadow:inset 3px 0 var(--a)}.card{border-radius:20px;background:linear-gradient(145deg,#ffffff10,#ffffff05);box-shadow:0 8px 30px #0006;transition:.25s}.card:hover{transform:translateY(-2px);border-color:#2dd4bf55}.btn{border-radius:99px;padding:9px 16px;box-shadow:0 4px 14px #2563eb44;transition:.2s}.btn:hover{transform:translateY(-2px);filter:brightness(1.15)}.btn:active{transform:scale(.96)}.stat b{font-size:26px;background:linear-gradient(90deg,var(--a),var(--g));-webkit-background-clip:text;background-clip:text;color:transparent}h2{font-size:24px;background:linear-gradient(90deg,#fff,var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}.tro{position:relative}.tro .ic{height:76px;display:grid;place-items:center;filter:drop-shadow(0 0 10px #fbbf2488);animation:fl 4s ease-in-out infinite}.tro .ic svg{height:72px;width:auto}@keyframes fl{50%{transform:translateY(-3px)}}.x{position:absolute;top:0;right:2px;width:24px;height:24px;border-radius:50%;border:0;background:#b91c1ccc;color:#fff;cursor:pointer;font-size:11px;z-index:2;transition:.2s}.x:hover{transform:scale(1.2);background:#ef4444}.shelf .tro{width:104px}#modal>div{border-radius:22px;animation:pop .35s}@media(max-width:760px){#app{display:block}nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;display:flex;overflow-x:auto;border-top:1px solid var(--b);background:#0a0e17ee;z-index:40;padding:6px}nav .logo{display:none}nav button{width:auto;white-space:nowrap}main{padding:12px 12px 80px}}
</style></head><body><div id="app"><nav id="nav"></nav><main id="main"></main></div><div id="modal"></div><svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gG" x1="0" x2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".45" stop-color="#fbbf24"/><stop offset="1" stop-color="#b45309"/></linearGradient><linearGradient id="gS" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#cbd5e1"/><stop offset="1" stop-color="#64748b"/></linearGradient><linearGradient id="gV" x1="0" x2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#047857"/></linearGradient></defs></svg>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WORLD={Eropa:{England:{"Premier League":["Manchester United","Liverpool","Arsenal","Manchester City","Chelsea"],"Championship":["Leeds United","Leicester City"]},Spanyol:{"La Liga":["Real Madrid","FC Barcelona","Atlético Madrid"]},Italia:{"Serie A":["Juventus","AC Milan","Inter"]},Jerman:{"Bundesliga":["Bayern München","Borussia Dortmund"]},Prancis:{"Ligue 1":["Paris Saint-Germain","Marseille"]}},Asia:{Indonesia:{"Liga 1":["Persija Jakarta","Persib Bandung","Persebaya"],"Liga 2":["Sriwijaya FC"]},Jepang:{"J1 League":["Vissel Kobe"]}},Afrika:{Mesir:{"Egyptian Premier":["Al Ahly"]}},"Amerika Utara":{AS:{MLS:["Inter Miami"]}},"Amerika Selatan":{Brasil:{"Brasileirão":["Flamengo","Palmeiras"]},Argentina:{"Liga Profesional":["Boca Juniors","River Plate"]}},Oceania:{Australia:{"A-League":["Sydney FC"]}}};
const TROPHIES=["Premier League","La Liga","Serie A","Bundesliga","Ligue 1","Liga 1 Indonesia","Brasileirão","FA Cup","Carabao Cup","Copa del Rey","Coppa Italia","DFB-Pokal","Coupe de France","KNVB Cup","Taça de Portugal","UEFA Champions League","UEFA Europa League","UEFA Super Cup","FIFA World Cup","Continental Cup","Olympic Football"];
const AWARDS=["Ballon d'Or","Golden Boot","Golden Glove","Player of the Season","Young Player of the Season","FIFA Best","UEFA Player of the Year","Team of the Season","Top Assist","Player of the Month"];
const PAGES=[["dash","🏠","Dashboard"],["career","👤","Karier"],["stats","📊","Statistik"],["match","⚽","Match"],["world","🌍","World"],["troph","🏆","Trofi"],["award","🥇","Awards"],["trans","💰","Transfer"],["chat","💬","Pesan"],["social","📱","Social"],["rival","🔥","Rivalitas"],["news","📰","News"],["press","🎙️","Press"],["hist","📜","History"],["rec","🏅","Records"],["set","⚙️","Save"]];
const ls=(k,v)=>{try{return v===undefined?JSON.parse(localStorage.getItem(k)):localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
let DB=ls('fc27')||{cur:null,list:{}},S,page='dash';
const rid=()=>Math.random().toString(36).slice(2,9),pick=a=>a[Math.floor(Math.random()*a.length)],yr=()=>S.season;
function sample(){return{id:rid(),name:'Karier Lang Jr',type:'Player',created:Date.now(),season:'2026/27',p:{name:'Lang Jr',country:'Indonesia',age:19,pos:'ST',club:'Paris Saint-Germain',league:'Ligue 1',ovr:78,pot:91,value:45,salary:120,contract:'2030',foot:'Kanan',bio:'Wonderkid dari Jakarta.'},rep:20,morale:70,media:50,fans:50,seasons:[{s:'2026/27',club:'Paris Saint-Germain',league:'Ligue 1',apps:0,goals:0,assists:0,cs:0,motm:0,yc:0,rc:0,pos:'-'}],matches:[],trophies:[],awards:[],transfers:[{date:'2026/27',from:'Persija Jakarta',to:'Paris Saint-Germain',type:'Permanent',fee:45,salary:120}],posts:[],rivals:[{name:'Kylian Mbappé',score:55,m:12,w:7,l:3,d:2,gf:10,ga:7}],news:[{t:'LANG JR TIBA DI PARIS: Era baru dimulai',d:'2026/27'}],ach:[],chat:{}}}
function save(){if(!S)return;DB.list[S.id]=S;DB.cur=S.id;if(!ls('fc27',DB))toast('⚠️ Penyimpanan penuh, ekspor JSON!')}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2600)}
function modal(h){const m=$('#modal');m.innerHTML='<div>'+h+'</div>';m.style.display='flex';m.onclick=e=>{if(e.target===m)close()}}function close(){$('#modal').style.display='none'}
function form(title,fs,cb){modal(`<h3>${title}</h3>${fs.map(f=>`<label>${f.l}</label>${f.o?`<select id="f_${f.k}">${f.o.map(o=>`<option ${o==f.v?'selected':''}>${esc(o)}</option>`).join('')}</select>`:f.t=='area'?`<textarea id="f_${f.k}" rows=3>${esc(f.v||'')}</textarea>`:`<input id="f_${f.k}" type="${f.t||'text'}" value="${esc(f.v??'')}">`}`).join('')}<button class="btn" id="ok">Simpan</button><button class="btn g" onclick="close()">Batal</button>`);
$('#ok').onclick=()=>{const v={};for(const f of fs){const e=$('#f_'+f.k);v[f.k]=f.t=='number'?+e.value||0:e.value.trim();if(f.req&&!v[f.k]){toast('Isi '+f.l);return}}close();cb(v);save();render()}}
const sum=k=>S.seasons.reduce((a,s)=>a+(+s[k]||0),0);
function cur(){let c=S.seasons.find(s=>s.s==S.season);if(!c){c={s:S.season,club:S.p.club,league:S.p.league,apps:0,goals:0,assists:0,cs:0,motm:0,yc:0,rc:0,pos:'-'};S.seasons.push(c)}return c}
function news(t){S.news.unshift({t,d:S.season})}
function legacy(){return Math.round(S.trophies.length*8+sum('goals')*.4+sum('assists')*.25+S.awards.length*7+S.trophies.filter(t=>/Champions|World/.test(t.name)).length*15+S.rival_bonus||0)}
function tier(){const l=legacy();return l>400?'Football Legend':l>220?'World Class':l>110?'Superstar':l>40?'Elite':'Professional'}
function repLv(){const r=S.rep;return r>90?'Legend':r>75?'Global Superstar':r>55?'World Class':r>38?'Europe':r>20?'National':'Local'}
const ACH=[["⚽ First Goal",()=>sum('goals')>=1],["🏆 First Trophy",()=>S.trophies.length>=1],["⭐ 100 Career Goals",()=>sum('goals')>=100],["🔥 500 Career Goals",()=>sum('goals')>=500],["👑 Ballon d'Or Winner",()=>S.awards.some(a=>/Ballon/.test(a.name))],["🏆 Champions League Winner",()=>S.trophies.some(t=>/Champions/.test(t.name))],["🌍 World Cup Winner",()=>S.trophies.some(t=>/World Cup/.test(t.name))],["💰 Record Transfer",()=>S.transfers.some(t=>t.fee>=100)],["👑 League Champion",()=>S.trophies.some(t=>/Premier|Liga|Serie|Bundes|Ligue|Brasil/.test(t.name))]];
function checkAch(){ACH.forEach(([n,f])=>{if(!S.ach.includes(n)&&f()){S.ach.push(n);modal(`<div class="pop"><i>🎖️</i><h3>ACHIEVEMENT UNLOCKED</h3>${n}</div><button class="btn" onclick="close()">Lanjut</button>`);news('ACHIEVEMENT: '+n)}})}
function chart(vals,labels,color='#2dd4bf'){if(!vals.length)return'<p style="color:var(--m)">Belum ada data</p>';const W=320,H=110,mx=Math.max(...vals,1),st=W/Math.max(vals.length-1,1);const pts=vals.map((v,i)=>`${vals.length==1?W/2:i*st},${H-8-(v/mx)*(H-24)}`);return`<svg viewBox="0 0 ${W} ${H+16}" width="100%"><polyline fill="none" stroke="${color}" stroke-width="3" points="${pts.join(' ')}"/>${pts.map((p,i)=>`<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="4" fill="${color}"/><text x="${p.split(',')[0]}" y="${H+12}" font-size="9" fill="#8b95b0" text-anchor="middle">${esc(labels[i]||'').slice(2,7)}</text>`).join('')}</svg>`}
const V={};
V.dash=()=>{const p=S.p;return`<div class="card"><div class="row"><div style="flex:none;width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,var(--a),#2563eb);display:grid;place-items:center;font-size:32px;font-weight:800">${esc(p.name[0])}</div><div style="flex:3"><h2 style="margin:0">${esc(p.name)} <span class="tag">${esc(S.type)}</span></h2>${esc(p.age)} th · ${esc(p.country)} · ${esc(p.pos)}<br>${esc(p.club)} — ${esc(p.league)}<br><span class="tag">${repLv()}</span> <span class="tag">Legacy: ${tier()}</span></div></div>
<div class="grid" style="margin-top:12px">${[['OVR',p.ovr],['POT',p.pot],['Value','€'+p.value+'M'],['Gaji','€'+p.salary+'k/w'],['Kontrak',p.contract],['Match',sum('apps')],['Gol',sum('goals')],['Assist',sum('assists')],['CS',sum('cs')],['MOTM',sum('motm')],['Trofi',S.trophies.length],['Awards',S.awards.length],['Reputasi',S.rep],['Rank Dunia','#'+Math.max(1,101-Math.round(S.rep+p.ovr/2))]].map(x=>`<div class="stat card" style="margin:0"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div></div>
<div class="card"><button class="btn" onclick="go('match')">▶ CONTINUE CAREER</button><button class="btn" onclick="newSeason()">NEW SEASON</button><button class="btn g" onclick="save();toast('💾 Tersimpan')">SAVE</button><button class="btn g" onclick="go('set')">LOAD</button><button class="btn g" onclick="exportJ()">EXPORT</button><button class="btn g" onclick="importJ()">IMPORT</button><button class="btn g" onclick="editP()">Edit Profil</button></div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"><div class="card"><h3>Gol per Musim</h3>${chart(S.seasons.map(s=>s.goals),S.seasons.map(s=>s.s))}</div><div class="card"><h3>Assist per Musim</h3>${chart(S.seasons.map(s=>s.assists),S.seasons.map(s=>s.s),'#fbbf24')}</div><div class="card"><h3>Rating Progress</h3>${chart(S.seasons.map(s=>+s.ovr||S.p.ovr),S.seasons.map(s=>s.s),'#a78bfa')}</div><div class="card"><h3>Nilai Transfer (€M)</h3>${chart(S.transfers.map(t=>t.fee),S.transfers.map(t=>t.date),'#f87171')}</div></div>
<div class="card"><h3>Moral & Media</h3>Moral<div class="bar"><i style="width:${S.morale}%"></i></div><br>Media<div class="bar"><i style="width:${S.media}%"></i></div><br>Fans<div class="bar"><i style="width:${S.fans}%"></i></div></div>`};
function editP(){const p=S.p;form('Profil',[{k:'name',l:'Nama',v:p.name,req:1},{k:'age',l:'Umur',t:'number',v:p.age},{k:'country',l:'Negara',v:p.country},{k:'pos',l:'Posisi',v:p.pos},{k:'club',l:'Klub',v:p.club},{k:'league',l:'Liga',v:p.league},{k:'ovr',l:'Overall',t:'number',v:p.ovr},{k:'pot',l:'Potential',t:'number',v:p.pot},{k:'value',l:'Market Value (€M)',t:'number',v:p.value},{k:'salary',l:'Gaji (€k/w)',t:'number',v:p.salary},{k:'contract',l:'Kontrak s/d',v:p.contract},{k:'bio',l:'Bio',t:'area',v:p.bio}],v=>Object.assign(S.p,v))}
function newSeason(){const [a]=S.season.split('/');const n=(+a+1)+'/'+String(+a+2).slice(2);form('Musim Baru '+n,[{k:'x',l:'Umur bertambah 1 tahun. Lanjut? (ketik ya)',v:'ya'}],()=>{S.season=n;S.p.age++;cur();news('Musim '+n+' dimulai!')})}
V.career=()=>`<h2>Karier Saya</h2><div class="card">${Object.entries(S.p).map(([k,v])=>`<div class="row"><b style="flex:1;color:var(--m)">${k}</b><span style="flex:3">${esc(v)}</span></div>`).join('')}<button class="btn" onclick="editP()">Edit</button></div><div class="card"><h3>Status</h3>Legacy Score <b>${legacy()}</b> — ${tier()}<br>Achievements: ${S.ach.join(' · ')||'-'}</div>`;
V.stats=()=>`<h2>Statistik</h2><div class="card" style="overflow:auto"><table><tr><th>Musim</th><th>Klub</th><th>Liga</th><th>App</th><th>G</th><th>A</th><th>CS</th><th>MOTM</th><th>YC</th><th>RC</th></tr>${S.seasons.map(s=>`<tr><td>${s.s}</td><td>${esc(s.club)}</td><td>${esc(s.league)}</td><td>${s.apps}</td><td>${s.goals}</td><td>${s.assists}</td><td>${s.cs}</td><td>${s.motm}</td><td>${s.yc}</td><td>${s.rc}</td></tr>`).join('')}<tr><th colspan=3>TOTAL</th><th>${sum('apps')}</th><th>${sum('goals')}</th><th>${sum('assists')}</th><th>${sum('cs')}</th><th>${sum('motm')}</th><th>${sum('yc')}</th><th>${sum('rc')}</th></tr></table></div>
<div class="card"><h3>Per Kompetisi</h3>${['League','Domestic Cup','Continental','International','Friendly'].map(c=>{const m=S.matches.filter(x=>x.comp==c);return`<span class="tag">${c}</span> ${m.length} match · ${m.reduce((a,x)=>a+x.g,0)} gol · ${m.reduce((a,x)=>a+x.a,0)} assist<br>`}).join('')}</div>`;
V.match=()=>`<h2>Match Center</h2><button class="btn" onclick="addMatch()">＋ Catat Match</button><div class="card" style="margin-top:10px">${S.matches.map(m=>`<div style="padding:8px 0;border-bottom:1px solid var(--b)"><b>${m.res=='W'?'✅':m.res=='D'?'➖':'❌'} ${esc(m.home?'vs':'@')} ${esc(m.opp)}</b> ${m.sf}-${m.sa} <span class="tag">${m.comp}</span> ${m.date}<br><small>⚽${m.g} 🅰️${m.a} ⭐${m.rating} ${m.motm?'🏅MOTM':''} ${esc(m.note)}</small> <button class="btn g" onclick="delM('${m.id}')">🗑</button></div>`).join('')||'Belum ada match.'}</div>`;
function addMatch(){form('Catat Match',[{k:'date',l:'Tanggal',t:'date',v:new Date().toISOString().slice(0,10)},{k:'comp',l:'Kompetisi',o:['League','Domestic Cup','Continental','International','Friendly']},{k:'opp',l:'Lawan',req:1},{k:'home',l:'Venue',o:['Home','Away']},{k:'sf',l:'Skor kita',t:'number',v:0},{k:'sa',l:'Skor lawan',t:'number',v:0},{k:'g',l:'Gol',t:'number',v:0},{k:'a',l:'Assist',t:'number',v:0},{k:'rating',l:'Rating',t:'number',v:7},{k:'motm',l:'MOTM',o:['Tidak','Ya']},{k:'note',l:'Catatan taktik'}],v=>{
v.home=v.home=='Home';v.motm=v.motm=='Ya';v.rating=Math.min(10,Math.max(1,v.rating));v.res=v.sf>v.sa?'W':v.sf<v.sa?'L':'D';v.id=rid();S.matches.unshift(v);const c=cur();c.apps++;c.goals+=v.g;c.assists+=v.a;if(v.motm)c.motm++;if(!v.sa)c.cs++;
S.rep=Math.min(100,S.rep+v.g*.4+(v.motm?.5:0)+(v.res=='W'?.3:0));S.morale=Math.max(0,Math.min(100,S.morale+(v.res=='W'?4:v.res=='L'?-5:0)));
const r=S.rivals.find(x=>x.name.toLowerCase()==v.opp.toLowerCase());if(r){r.m++;r[v.res.toLowerCase()=='w'?'w':v.res=='L'?'l':'d']++;r.gf+=v.sf;r.ga+=v.sa;r.score=Math.min(100,r.score+(v.res=='W'?3:2));news('RIVALRY HEATS UP: '+S.p.name+' vs '+r.name+' ('+v.sf+'-'+v.sa+')')}

V.world=()=>{const q=(window.wq||'').toLowerCase();return`<h2>World Football</h2><input placeholder="🔍 Cari klub, liga, negara, trofi, award..." value="${esc(window.wq||'')}" oninput="wq=this.value;clearTimeout(window.wt);window.wt=setTimeout(()=>{render();const i=$('input');i.focus();i.setSelectionRange(99,99)},250)">`+Object.entries(WORLD).map(([cont,cs])=>{const items=Object.entries(cs).map(([c,ls])=>Object.entries(ls).map(([l,cl])=>({c,l,cl:cl.filter(x=>!q||(x+l+c+cont).toLowerCase().includes(q))})).filter(x=>x.cl.length)).flat();return items.length?`<div class="card"><h3>${cont}</h3>${items.map(i=>`<div><span class="tag">${i.c}</span> <b>${i.l}</b><br>${i.cl.map(x=>`<button class="btn g" onclick="club('${x.replace(/'/g,"\\'")}','${i.l}','${i.c}')">${x}</button>`).join('')}</div>`).join('<br>')}</div>`:''}).join('')+(q?`<div class="card"><h3>Trofi & Award</h3>${[...TROPHIES,...AWARDS].filter(x=>x.toLowerCase().includes(q)).map(x=>`<span class="tag">${x}</span> `).join('')||'-'}</div>`:'')+`<div class="card"><button class="btn" onclick="addClub()">＋ Tambah Klub Custom</button></div>`};

V.troph=()=>{const t=S.trophies,by=(k)=>Object.entries(t.reduce((a,x)=>(a[x[k]]=(a[x[k]]||0)+1,a),{})).sort((a,b)=>b[1]-a[1])[0];const dom=t.filter(x=>/Premier|Liga|Serie|Bundes|Ligue|Cup|Copa|Coppa|Pokal|Coupe|KNVB|Ta[cç]a/.test(x.name)&&!/UEFA|Continental/.test(x.name)).length,eu=t.filter(x=>/UEFA/.test(x.name)).length;return`<h2>My Trophy Room</h2><button class="btn" onclick="addTro()">＋ Menangkan Trofi</button><button class="btn g" onclick="seedDemo()">Muat Data Contoh</button><div class="grid" style="margin:10px 0">${[['Total',t.length],['Domestik',dom],['Eropa/Kontinental',eu],['Internasional',t.length-dom-eu],['Musim Terbaik',by('season')?.[0]||'-'],['Klub Tersukses',by('club')?.[0]||'-']].map(x=>`<div class="card stat" style="margin:0"><b style="font-size:16px">${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div>${cabinet(t)}<small style="color:var(--m)">Tekan ✕ di pojok trofi untuk menghapus. Desain trofi orisinal, terinspirasi bentuk kompetisinya.</small>`};
function cabinet(t){const sh=[['🏆 Liga',/Premier|La Liga|Serie A|Bundesliga|Ligue 1|Liga 1|Brasileirão/,'0deg'],['🥈 Piala Domestik',/FA Cup|Carabao|Copa del Rey|Coppa|Pokal|Coupe|KNVB|Ta[cç]a/,'160deg'],['⭐ Eropa',/UEFA/,'200deg'],['🌍 Internasional & Lainnya',/^$/,'60deg']];const used=new Set();const rows=sh.slice(0,3).map(([n,re,hue])=>{const it=t.filter(x=>re.test(x.name));it.forEach(x=>used.add(x.id));return[n,it,hue]});rows.push([sh[3][0],t.filter(x=>!used.has(x.id)),sh[3][2]]);return`<div class="cabinet">${rows.map(([n,it,hue])=>`<div class="shelf"><h4>${n} · ${it.length}</h4><div class="items">${it.map(x=>`<div class="tro"><button class="x" title="Hapus trofi" onclick="delItem('trophies','${x.id}')">✕</button><div class="ic">${trophySVG(x.name)}</div><b>${esc(x.name)}</b><br>${x.season}<br>${esc(x.club)}</div>`).join('')||'<span class="empty">Rak kosong</span>'}</div></div>`).join('')}</div>`}
function addTro(){form('Trofi Baru',[{k:'name',l:'Kompetisi',o:TROPHIES},{k:'cust',l:'Atau nama kompetisi baru'},{k:'season',l:'Musim',v:S.season},{k:'club',l:'Klub',v:S.p.club},{k:'role',l:'Peran',o:['Player','Manager']}],v=>{const n=v.cust||v.name;if(v.cust&&!TROPHIES.includes(n))TROPHIES.push(n);S.trophies.push({id:rid(),name:n,season:v.season,club:v.club,role:v.role,date:new Date().toISOString().slice(0,10)});S.rep=Math.min(100,S.rep+3);news(S.p.name.toUpperCase()+' MENANG '+n.toUpperCase()+' BERSAMA '+v.club);setTimeout(()=>{modal(`<div class="pop"><i>🏆</i><h3>${esc(n)}</h3>${v.season} · ${esc(v.club)}</div><button class="btn" onclick="close();checkAch()">Luar biasa!</button>`)},50)})}
function awCab(a){const g=[['👑 Penghargaan Utama',/Ballon|FIFA|UEFA/],['⭐ Penghargaan Musim',/Boot|Glove|Season|Team of|Assist/]];const used=new Set();const rows=g.map(([n,re])=>{const it=a.filter(x=>!used.has(x.id)&&re.test(x.name));it.forEach(x=>used.add(x.id));return[n,it]});rows.push(['📅 Bulanan & Lainnya',a.filter(x=>!used.has(x.id))]);return`<div class="cabinet">${rows.map(([n,it])=>`<div class="shelf"><h4>${n} · ${it.length}</h4><div class="items">${it.map(x=>`<div class="tro"><button class="x" title="Hapus award" onclick="delItem('awards','${x.id}')">✕</button><div class="ic">${awSVG()}</div><b>${esc(x.name)}</b><br>${x.season}</div>`).join('')||'<span class="empty">Rak kosong</span>'}</div></div>`).join('')}</div>`}
function seedDemo(q){const s='2026/27',c='Paris Saint-Germain',d='2027-05-20';['Coupe de France'].forEach(n=>{if(!TROPHIES.includes(n))TROPHIES.push(n)});S.trophies=[['Ligue 1'],['Coupe de France'],['UEFA Champions League'],['UEFA Super Cup']].map(([n])=>({id:rid(),name:n,season:s,club:c,role:'Player',date:d}));S.awards=['Golden Boot','Young Player of the Season','Player of the Season','Team of the Season','Top Assist','Player of the Month'].map(n=>({id:rid(),name:n,season:s}));const x=S.seasons[0]||cur();if(!x.apps)Object.assign(x,{apps:45,goals:38,assists:15,motm:9,yc:3});S.rep=Math.max(S.rep,62);S.seeded=1;news('LANG JR WINS CHAMPIONS LEAGUE');news('PSG juara Ligue 1 dan Coupe de France');ACH.forEach(([n,f])=>{if(f()&&!S.ach.includes(n))S.ach.push(n)});save();if(!q){toast('🏆 Data contoh dimuat');render()}}
function ask(m,fn){window._ask=fn;modal(`<h3>⚠️ Konfirmasi</h3><p>${esc(m)}</p><button class="btn r" onclick="close();_ask()">Ya, hapus</button><button class="btn g" onclick="close()">Batal</button>`)}
function delItem(k,id){const it=S[k].find(x=>x.id==id);ask('Hapus '+(it?it.name:'item')+'?',()=>{S[k]=S[k].filter(x=>x.id!=id);save();render();toast('🗑 Dihapus')})}
function trophySVG(n){const w=/World Cup/.test(n),e=/UEFA|Continental|Olympic/.test(n),c=/Cup|Copa|Coppa|Pokal|Coupe|KNVB|Ta[cç]a/.test(n);const base=f=>`<rect x="20" y="62" width="28" height="6" rx="2" fill="${f}"/><rect x="15" y="68" width="38" height="8" rx="3" fill="${f}"/>`;let b;if(w)b=`<circle cx="34" cy="16" r="13" fill="url(#gG)"/><path d="M22 28q12 6 24 0l-6 28q-6 4-12 0z" fill="url(#gG)"/>${base('url(#gV)')}`;else if(e)b=`<path d="M22 6h24v16q0 14-12 18q-12-4-12-18z" fill="url(#gS)"/><path d="M22 10q-14-2-12 10q2 10 14 12M46 10q14-2 12 10q-2 10-14 12" fill="none" stroke="url(#gS)" stroke-width="4"/><rect x="30" y="40" width="8" height="22" fill="url(#gS)"/>${base('#1e3a8a')}`;else if(c)b=`<path d="M20 8h28v14q0 14-14 18q-14-4-14-18z" fill="url(#gG)"/><path d="M20 12h-8q0 12 10 16M48 12h8q0 12-10 16" fill="none" stroke="url(#gG)" stroke-width="3"/><rect x="30" y="40" width="8" height="22" fill="url(#gG)"/>${base('#991b1b')}`;else b=`<rect x="28" y="2" width="12" height="6" rx="3" fill="url(#gG)"/><path d="M18 8h32l-4 30q-12 8-24 0z" fill="url(#gG)"/><rect x="29" y="38" width="10" height="24" fill="url(#gG)"/>${base('url(#gV)')}`;return`<svg viewBox="0 0 68 78">${b}<path d="M26 12q-2 14 2 24" stroke="#fff8" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`}
function awSVG(){return`<svg viewBox="0 0 60 78"><path d="M18 0l12 26 12-26h-8l-4 12-4-12z" fill="#dc2626"/><circle cx="30" cy="50" r="22" fill="url(#gG)"/><circle cx="30" cy="50" r="16" fill="none" stroke="#b45309" stroke-width="2"/><path d="M30 38l3.5 8 8.5.8-6.5 5.5 2 8.4-7.5-4.5-7.5 4.5 2-8.4-6.5-5.5 8.5-.8z" fill="#b45309"/></svg>`}

function addTr(pre){form('Transfer',[{k:'from',l:'Klub asal',v:S.p.club},{k:'to',l:'Klub tujuan',v:pre?.to||'',req:1},{k:'type',l:'Jenis',o:['Permanent','Loan','Free Transfer','Contract Renewal']},{k:'fee',l:'Fee (€M)',t:'number',v:pre?.fee||0},{k:'salary',l:'Gaji (€k/w)',t:'number',v:pre?.sal||S.p.salary},{k:'len',l:'Kontrak (tahun)',t:'number',v:4},{k:'num',l:'No. punggung',t:'number',v:9},{k:'agent',l:'Agent'},{k:'reason',l:'Alasan'}],v=>{v.date=S.season;S.transfers.push(v);if(v.type!='Contract Renewal'){S.p.club=v.to;cur().club=v.to}S.p.salary=v.salary;S.p.contract=+S.season.slice(0,4)+v.len;S.p.value=Math.max(S.p.value,v.fee);news(v.to.toUpperCase()+' UMUMKAN TRANSFER '+S.p.name.toUpperCase()+' (€'+v.fee+'M)');setTimeout(()=>{toast('✍️ HERE WE GO!');checkAch()},100)})}

function shrink(f,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,600/i.width);c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.6))};i.src=r.result};r.readAsDataURL(f)}

const PA={Tenang:[1,0,1,0],Percaya_diri:[1,2,0,1],Hormat:[2,1,-1,0],Provokatif:[3,-1,3,-1],Rendah_hati:[1,2,-1,1]};
V.press=()=>{const q=window.pq=window.pq||pick(PQ);return`<h2>Press Conference</h2><div class="card"><span class="tag">${q[0]}</span><p>🎤 <i>${q[1]}</i></p>${Object.keys(PA).map(a=>`<button class="btn g" onclick="ans('${a}')">${a.replace('_',' ')}</button>`).join('')}</div><div class="card">Media ${S.media}<div class="bar"><i style="width:${S.media}%"></i></div></div>`};
function ans(a){const [m,f,r,mo]=PA[a];S.media=Math.max(0,Math.min(100,S.media+m*2));S.fans=Math.max(0,Math.min(100,S.fans+f*2));S.morale=Math.max(0,Math.min(100,S.morale+mo*2));if(r>0&&S.rivals[0])S.rivals[0].score=Math.min(100,S.rivals[0].score+r*2);news(S.p.name+' ('+a.replace('_',' ')+'): "'+window.pq[1].slice(0,40)+'…"');window.pq=null;toast('🎙️ Media: '+(m>1?'senang':'netral'));save();render()}
V.hist=()=>`<h2>Career History</h2>${S.seasons.slice().reverse().map(s=>{const tr=S.trophies.filter(t=>t.season==s.s),aw=S.awards.filter(t=>t.season==s.s);return`<div class="card"><h3>${s.s}</h3>Club: ${esc(s.club)} · Liga: ${esc(s.league)}<br>Apps ${s.apps} · Gol ${s.goals} · Assist ${s.assists}<br>Trofi: ${tr.map(t=>esc(t.name)).join(', ')||'-'}<br>Awards: ${aw.map(t=>esc(t.name)).join(', ')||'-'}</div>`}).join('')}<div class="card"><h3>Timeline</h3>${[...S.news].reverse().slice(-12).map(n=>`<div>● ${n.d} — ${esc(n.t)}</div>`).join('<div>↓</div>')}</div>`;
V.rec=()=>{const m=S.matches,bs=Math.max(0,...S.seasons.map(s=>s.goals));return`<h2>Career Records</h2><div class="card">${[['Gol',sum('goals')],['Assist',sum('assists')],['Penampilan',sum('apps')],['MOTM',sum('motm')],['Trofi',S.trophies.length],['Gol 1 musim',bs],['Biggest win',m.filter(x=>x.res=='W').map(x=>x.sf-x.sa).sort((a,b)=>b-a)[0]||0],['Transfer termahal','€'+Math.max(0,...S.transfers.map(t=>t.fee))+'M'],['Gaji tertinggi','€'+Math.max(0,...S.transfers.map(t=>t.salary))+'k/w']].map(x=>`<div class="row"><span>${x[0]}</span><b style="text-align:right">${x[1]}</b></div>`).join('')}</div><div class="card"><h3>Legacy Score: ${legacy()}</h3><b>${tier()}</b><br><br><button class="btn" onclick="retire()">🎖️ Pensiun</button><button class="btn g" onclick="summary()">Export Summary</button></div>`};
function retire(){modal(`<h3>CAREER RETIREMENT</h3>Apps ${sum('apps')} · Gol ${sum('goals')} · Assist ${sum('assists')}<br>Trofi ${S.trophies.length} · Awards ${S.awards.length}<br>Klub: ${[...new Set(S.seasons.map(s=>s.club))].length} · Legacy: ${tier()}<br><br><button class="btn" onclick="S.type='Manager';S.p.pos='MGR';close();save();toast('Kini kamu manager!');render()">BECOME A MANAGER</button><button class="btn g" onclick="close()">Tutup</button>`)}
function summary(){const h=`<!DOCTYPE html><meta charset=utf-8><title>${esc(S.p.name)}</title><body style="font-family:sans-serif;background:#0a0e17;color:#fff;padding:24px"><h1>${esc(S.p.name)} — ${tier()}</h1><p>${S.p.club} · ${sum('apps')} match · ${sum('goals')} gol · ${sum('assists')} assist · ${S.trophies.length} trofi · ${S.awards.length} award</p><ul>${S.trophies.map(t=>`<li>🏆 ${esc(t.name)} ${t.season}`).join('')}</ul>`;dl(h,'summary.html','text/html')}
function dl(txt,fn,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=fn;a.click()}
function exportJ(){dl(JSON.stringify(S,null,1),S.name.replace(/\W+/g,'_')+'.json','application/json');toast('Diekspor')}
function importJ(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.p||!d.seasons)throw 0;d.id=rid();S=d;save();toast('Diimpor');render()}catch(e){toast('❌ File tidak valid')}};r.readAsText(i.files[0])};i.click()}
V.set=()=>`<h2>Save & Karier</h2><div class="card"><button class="btn" onclick="save();toast('💾 Tersimpan')">Save</button><button class="btn g" onclick="newC()">New Career</button><button class="btn g" onclick="saveAs()">Save As</button><button class="btn g" onclick="rename()">Rename</button><button class="btn g" onclick="exportJ()">Export JSON</button><button class="btn g" onclick="importJ()">Import JSON</button><button class="btn g" onclick="backup()">Backup</button><button class="btn g" onclick="restore()">Restore</button><br><label>Auto Save</label><select onchange="DB.auto=this.value=='on';ls('fc27',DB)"><option value="on" ${DB.auto!==false?'selected':''}>Aktif</option><option value="off" ${DB.auto===false?'selected':''}>Nonaktif</option></select></div><div class="card"><h3>Karier Tersimpan</h3>${Object.values(DB.list).map(c=>`<div class="row" style="padding:6px 0"><b style="flex:3">${esc(c.name)} ${c.id==S.id?'<span class="tag">aktif</span>':''}</b><button class="btn g" onclick="loadC('${c.id}')">Load</button><button class="btn g" onclick="dup('${c.id}')">Duplikat</button><button class="btn r" onclick="delC('${c.id}')">Hapus</button></div>`).join('')}</div>`;
function newC(){form('Karier Baru',[{k:'name',l:'Nama karier',req:1},{k:'pn',l:'Nama pemain/manager',req:1},{k:'type',l:'Tipe',o:['Player','Manager','Club','National Team']},{k:'country',l:'Negara',v:'Indonesia'},{k:'club',l:'Klub awal',v:'Persija Jakarta'}],v=>{S=sample();S.name=v.name;S.type=v.type;Object.assign(S.p,{name:v.pn,country:v.country,club:v.club,league:'Liga 1',value:5,salary:20,ovr:65,pot:85});S.seasons=[];S.transfers=[];S.news=[];S.rivals=[];S.rep=5;cur();news(v.pn+' memulai karier di '+v.club)})}
function saveAs(){form('Save As',[{k:'n',l:'Nama baru',req:1}],v=>{S=JSON.parse(JSON.stringify(S));S.id=rid();S.name=v.n})}
function rename(){form('Rename',[{k:'n',l:'Nama',v:S.name,req:1}],v=>S.name=v.n)}
function dup(id){const c=JSON.parse(JSON.stringify(DB.list[id]));c.id=rid();c.name+=' (copy)';DB.list[c.id]=c;ls('fc27',DB);render()}
function loadC(id){S=DB.list[id];DB.cur=id;ls('fc27',DB);toast('Dimuat');render()}
function delC(id){if(Object.keys(DB.list).length<2){toast('Minimal 1 karier');return}ask('Hapus karier ini?',()=>{delete DB.list[id];if(S.id==id)S=Object.values(DB.list)[0];DB.cur=S.id;ls('fc27',DB);render()})}
function backup(){ls('fc27_backup',DB);toast('Backup dibuat')}
function restore(){const b=ls('fc27_backup');if(!b){toast('Belum ada backup');return}DB=b;S=DB.list[DB.cur]||Object.values(DB.list)[0];ls('fc27',DB);render();toast('Dipulihkan')}
function go(p){page=p;render();scrollTo(0,0)}
function render(){$('#nav').innerHTML='<div class="logo">FC27 CAREER HUB</div>'+PAGES.map(p=>`<button class="${p[0]==page?'on':''}" onclick="go('${p[0]}')">${p[1]} ${p[2]}</button>`).join('');$('#main').innerHTML=V[page]();$('#main').style.animation='none';$('#main').offsetWidth;$('#main').style.animation='';if(DB.auto!==false)save()}
if(!DB.cur||!DB.list[DB.cur]){S=sample();save()}else S=DB.list[DB.cur];
S.rivals=S.rivals||S.rival||[];if(S.name=='Karier Lang Jr'&&!S.trophies.length&&!S.awards.length&&!S.seeded)seedDemo(true);render();
</script></body></html>
